<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eras Locator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* Palet tiap era */
    body {
      --bg1: #ffd1e8;
      --bg2: #b8e0ff;
      --card: #fff8fb;
      --ink: #4a2c4d;
      --accent: #ff6fa5;
      --on: #fff
    }

    body[data-era="midnights"] {
      --bg1: #14183a;
      --bg2: #3b3f7a;
      --card: #1d2150;
      --ink: #e8e6ff;
      --accent: #9d8cff;
      --on: #14183a
    }

    body[data-era="folklore"] {
      --bg1: #d5d5d2;
      --bg2: #8f948f;
      --card: #f2f1ee;
      --ink: #3a3d3a;
      --accent: #6f756d;
      --on: #fff
    }

    body[data-era="reputation"] {
      --bg1: #0b0b0b;
      --bg2: #2a2a2a;
      --card: #161616;
      --ink: #eeeeee;
      --accent: #d9d9d9;
      --on: #111
    }

    body[data-era="1989"] {
      --bg1: #bfe6f5;
      --bg2: #f7f0dd;
      --card: #fffdf6;
      --ink: #1f4a63;
      --accent: #3fa7d6;
      --on: #fff
    }

    body[data-era="red"] {
      --bg1: #5a0d18;
      --bg2: #a3182b;
      --card: #f7ece6;
      --ink: #4a0f16;
      --accent: #b01e30;
      --on: #fff
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Figtree, system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(140deg, var(--bg1), var(--bg2));
      transition: background .5s;
      position: relative;
      overflow: hidden;
    }

    .star {
      position: fixed;
      color: #fff;
      opacity: .7;
      animation: twinkle 3s ease-in-out infinite;
      pointer-events: none;
      user-select: none
    }

    @keyframes twinkle {
      50% {
        opacity: .15;
        transform: scale(.7)
      }
    }

    .card {
      width: min(440px, 100%);
      background: var(--card);
      border-radius: 20px;
      padding: 28px 28px 24px;
      box-shadow: 0 20px 50px #00000033;
      transition: background .4s;
      position: relative;
      z-index: 1;
    }

    .eras {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px
    }

    .eras button {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--card);
      box-shadow: 0 0 0 1.5px #00000033;
      cursor: pointer;
      padding: 0
    }

    .eras button[aria-pressed="true"] {
      box-shadow: 0 0 0 2.5px var(--ink);
      transform: scale(1.15)
    }

    .eras button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px
    }

    .head {
      text-align: center;
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .beads {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 12px 0 16px
    }

    .beads i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .9
    }

    .beads i:nth-child(3n+2) {
      background: var(--ink);
      opacity: .35
    }

    .beads i:nth-child(3n) {
      background: #fff;
      box-shadow: 0 0 0 1px #00000022
    }

    .who {
      text-align: center
    }

    .who b {
      font-family: 'DM Serif Display', serif;
      font-weight: 400;
      font-size: 1.35rem;
      display: block
    }

    .who span {
      opacity: .7;
      font-size: .95rem
    }

    form {
      display: flex;
      gap: 8px;
      margin: 20px 0 6px
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1.5px solid color-mix(in srgb, var(--ink) 25%, transparent);
      background: transparent;
      color: var(--ink);
      font: inherit;
      outline: none
    }

    input:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent)
    }

    input::placeholder {
      color: color-mix(in srgb, var(--ink) 50%, transparent)
    }

    .go {
      padding: 11px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--on);
      font: 600 .95rem Figtree, sans-serif;
      cursor: pointer
    }

    .go:hover {
      filter: brightness(1.08)
    }

    .go:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px
    }

    #status {
      min-height: 1.3em;
      font-size: .85rem;
      margin: 6px 2px 8px;
      opacity: .75
    }

    #status.err {
      color: #d6455d;
      opacity: 1
    }

    dl {
      display: none
    }

    dl.show {
      display: block;
      animation: fade .4s
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(6px)
      }
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 4px;
      border-top: 1px solid color-mix(in srgb, var(--ink) 15%, transparent)
    }

    dt {
      font-size: .8rem;
      opacity: .65;
      flex: none
    }

    dd {
      font-weight: 600;
      text-align: right;
      font-size: .95rem;
      word-break: break-word
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body data-era="lover">
  <span class="star" style="top:12%;left:9%;font-size:20px">✦</span>
  <span class="star" style="top:22%;right:12%;font-size:14px;animation-delay:.8s">✦</span>
  <span class="star" style="bottom:16%;left:16%;font-size:12px;animation-delay:1.6s">✦</span>
  <span class="star" style="bottom:10%;right:8%;font-size:22px;animation-delay:2.2s">✦</span>

  <main class="card">
    <div class="eras" id="eras" role="group" aria-label="Pilih era"></div>
    <p class="head" id="head">PWS</p>
    <div class="beads" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

    <div class="who">
      <b>Nur Azizah Ulinnuha</b>
      <span>20240140252</span>
    </div>

    <form id="form">
      <input id="q" placeholder="Cari lokasi, mis. Kasihan" autocomplete="off" required aria-label="Lokasi">
      <button class="go" type="submit">Cari</button>
    </form>
    <p id="status" role="status"></p>

    <dl id="out">
      <div class="row">
        <dt>Lokasi</dt>
        <dd id="lokasi"></dd>
      </div>
      <div class="row">
        <dt>Negara</dt>
        <dd id="negara"></dd>
      </div>
      <div class="row">
        <dt>Provinsi</dt>
        <dd id="provinsi"></dd>
      </div>
      <div class="row">
        <dt>Kecamatan</dt>
        <dd id="kecamatan"></dd>
      </div>
      <div class="row">
        <dt>Longitude</dt>
        <dd id="lon"></dd>
      </div>
      <div class="row">
        <dt>Latitude</dt>
        <dd id="lat"></dd>
      </div>
    </dl>
  </main>

  <script>
    const $ = id => document.getElementById(id);

    // Tanggal hari ini di header
    $("head").textContent = "PWS " + new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });

    // Pemilih era (tema warna)
    const eras = [
      ["lover", "Lover", "#ff6fa5"], ["midnights", "Midnights", "#3b3f7a"], ["folklore", "Folklore", "#8f948f"],
      ["reputation", "Reputation", "#111111"], ["1989", "1989", "#3fa7d6"], ["red", "Red", "#b01e30"]
    ];
    function setEra(id) {
      document.body.dataset.era = id;
      document.querySelectorAll("#eras button").forEach(b => b.setAttribute("aria-pressed", b.dataset.id === id));
      try { localStorage.setItem("era", id); } catch (e) { }
    }
    eras.forEach(([id, name, color]) => {
      const b = document.createElement("button");
      b.type = "button"; b.dataset.id = id; b.title = name; b.setAttribute("aria-label", "Era " + name);
      b.style.background = color;
      b.onclick = () => setEra(id);
      $("eras").appendChild(b);
    });
    let saved = "lover";
    try { saved = localStorage.getItem("era") || "lover"; } catch (e) { }
    setEra(eras.some(e => e[0] === saved) ? saved : "lover");

    // Cari lokasi lewat server sendiri
    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      const status = $("status");
      status.className = "";
      status.textContent = "Mencari...";
      try {
        const res = await fetch("/api/lokasi?q=" + encodeURIComponent($("q").value.trim()));
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Terjadi kesalahan");
        const d = data.hasil[0];
        $("lokasi").textContent = d.lokasi;
        $("negara").textContent = d.negara;
        $("provinsi").textContent = d.provinsi;
        $("kecamatan").textContent = d.kecamatan;
        $("lon").textContent = d.longitude.toFixed(6);
        $("lat").textContent = d.latitude.toFixed(6);
        $("out").classList.add("show");
        status.textContent = "";
      } catch (err) {
        $("out").classList.remove("show");
        status.className = "err";
        status.textContent = err.message;
      }
    });
  </script>
</body>

</html>
